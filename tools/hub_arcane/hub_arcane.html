<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub arcano (generatore)</title>
<style>
body{margin:0;background:#0d0d12;color:#e8e2d0;font-family:Georgia,serif;padding:20px}
h2{font-size:17px;margin:0 0 8px;color:#f0d9a0}
section{max-width:1408px;margin:0 auto 30px}
svg.s{width:100%;max-width:1408px;height:auto;display:block;border-radius:6px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="8"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.2"/></filter>
<filter id="mottle"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="4" seed="21"/><feColorMatrix type="matrix" values="1.6 0 0 0 -.3  1.6 0 0 0 -.3  1.6 0 0 0 -.3  0 0 0 0 1"/></filter>
<filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
<filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="b24"><feGaussianBlur stdDeviation="24"/></filter>
<radialGradient id="gW"><stop offset="0" stop-color="#ffb04a" stop-opacity=".75"/><stop offset=".4" stop-color="#ff8a2a" stop-opacity=".28"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
<radialGradient id="gP"><stop offset="0" stop-color="#a98aff" stop-opacity=".7"/><stop offset=".45" stop-color="#7a52ff" stop-opacity=".28"/><stop offset="1" stop-color="#6a3cff" stop-opacity="0"/></radialGradient>
<radialGradient id="gC"><stop offset="0" stop-color="#7ee6ff" stop-opacity=".7"/><stop offset=".45" stop-color="#3ab8ff" stop-opacity=".25"/><stop offset="1" stop-color="#2a9cff" stop-opacity="0"/></radialGradient>
<radialGradient id="vort"><stop offset="0" stop-color="#f0e8ff"/><stop offset=".12" stop-color="#b9a6ff"/><stop offset=".4" stop-color="#5a3ad0"/><stop offset=".78" stop-color="#25147a"/><stop offset="1" stop-color="#0b0630"/></radialGradient>
<radialGradient id="water"><stop offset="0" stop-color="#4f8f9c"/><stop offset=".7" stop-color="#2d5c6c"/><stop offset="1" stop-color="#1d3f4e"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".72"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".68"/></radialGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a26"/><stop offset=".55" stop-color="#171045"/><stop offset="1" stop-color="#2b1a5c"/></linearGradient>
<linearGradient id="eave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
</defs></svg>
<div id="root"></div>
<script>
// Generatore dell'hub "Piattaforma arcana sospesa" (GDD §7/§8). Aprire nel browser per l'anteprima completa;
// tools/hub_arcane/render.js lo usa con ?mode=ground|glow|prop&name=<id> per esportare gli asset di gioco.
const W=1408,H=768;
const Q=new URLSearchParams(location.search),MODE=Q.get('mode')||'full',PNAME=Q.get('name');
const PROPS={},PSTR={};
const PROP=(name,x,y,r,str,dy=0)=>{PROPS[name]={x,y:y+dy,r};PSTR[name]={str,dy};return MODE==='full'?str:''};
const cutProp=(s,a0,name,x,y,r,dy=0)=>s.slice(0,a0)+PROP(name,x,y,r,s.slice(a0),dy);
// Bordo del pavimento calpestabile delle isole raggiungibili (stesso calcolo di island(): usato per le collisioni).
const FLOOR_ISLANDS=[[190,410,180,140,63,-75],[1218,410,180,140,63,-75],[704,360,290,230,65,0]];
window.floorPaths=()=>FLOOR_ISLANDS.map(([cx,cy,rx,ry,seed,dy])=>{const n=16,j=.05,rr=mk(seed),k=[];for(let i=0;i<n;i++)k.push(1+(rr()-.5)*2*j);for(let i=0;i<n;i++){const m=((n/2-i)%n+n)%n;if(m<i)k[i]=k[m]}return smooth(k.map((v,i)=>{const a=i/n*Math.PI*2;return[cx+Math.cos(a)*(rx-13)*v,cy+dy-3+Math.sin(a)*(ry-11)*v]}))});
const mk=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const n1=v=>Math.round(v*10)/10;
let UID=0;
const smooth=p=>{const n=p.length;let d=`M${n1(p[0][0])},${n1(p[0][1])}`;for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];d+=`C${n1(b[0]+(c[0]-a[0])/6)},${n1(b[1]+(c[1]-a[1])/6)} ${n1(c[0]-(e[0]-b[0])/6)},${n1(c[1]-(e[1]-b[1])/6)} ${n1(c[0])},${n1(c[1])}`}return d+'Z'};
const blobPts=(cx,cy,rx,ry,r,n=12,j=.15)=>{const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=1+(r()-.5)*2*j;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return p};
const blob=(cx,cy,rx,ry,r,n,j)=>smooth(blobPts(cx,cy,rx,ry,r,n,j));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shade=(hex,f)=>{const v=parseInt(hex.slice(1),16);let R=v>>16,G=v>>8&255,B=v&255;const m=f<0?0:255,t=Math.abs(f);R=Math.round(R+(m-R)*t);G=Math.round(G+(m-G)*t);B=Math.round(B+(m-B)*t);return `rgb(${R},${G},${B})`};
const OL='#0d150f';

/* ------------- shared building blocks ------------- */
const tuft=(x,y,r,c)=>{let d='';const k=3+Math.floor(r()*3);for(let i=0;i<k;i++){const a=(i/(k-1)-.5)*1.4;d+=`M${x},${y}l${n1(Math.sin(a)*8)},${-6-Math.floor(r()*6)}`}return `<path d="${d}" stroke="${c}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`};
const tree=(x,y,R,r,pal=['#0f2a19','#1a4427','#2a6538','#4b8a4c'])=>{
  let s=`<g filter="url(#b4)" opacity=".5"><circle cx="${x+R*.22}" cy="${y+R*.32}" r="${R*.98}" fill="#000"/></g>`;
  const lumps=[];for(let i=0;i<8;i++){const a=i/8*6.283+r();lumps.push([x+Math.cos(a)*R*.5,y+Math.sin(a)*R*.5,R*(.5+r()*.16)])}
  lumps.push([x,y,R*.72]);
  s+=lumps.map(l=>`<path d="${blob(l[0],l[1],l[2],l[2],r,9,.12)}" fill="${pal[0]}" stroke="${OL}" stroke-width="3"/>`).join('');
  s+=lumps.map(l=>`<path d="${blob(l[0]-l[2]*.12,l[1]-l[2]*.14,l[2]*.78,l[2]*.78,r,9,.14)}" fill="${pal[1]}"/>`).join('');
  s+=lumps.map(l=>`<path d="${blob(l[0]-l[2]*.28,l[1]-l[2]*.3,l[2]*.46,l[2]*.42,r,8,.18)}" fill="${pal[2]}"/>`).join('');
  for(let i=0;i<Math.round(R/3);i++){const a=r()*6.283,d=r()*R*.75;s+=`<circle cx="${x+Math.cos(a)*d-R*.15}" cy="${y+Math.sin(a)*d-R*.18}" r="${1.5+r()*2.6}" fill="${pal[3]}" opacity=".7"/>`}
  return s};
const flame=(x,y,sc,L,gl='gW',gr=140)=>{
  L.push(`<circle cx="${x}" cy="${y}" r="${gr*sc}" fill="url(#${gl})"/>`);
  const f=(w,h,c,dy=0)=>`<path d="M${x},${y+h*.7+dy} C${x-w},${y+h*.3+dy} ${x-w*.55},${y-h*.35+dy} ${x},${y-h+dy} C${x+w*.55},${y-h*.35+dy} ${x+w},${y+h*.3+dy} ${x},${y+h*.7+dy}Z" fill="${c}"/>`;
  return f(9*sc,20*sc,'#e0501a')+f(7*sc,16*sc,'#ff9a28',1)+f(4.2*sc,11*sc,'#ffe27a',2)+f(2*sc,6*sc,'#fffbe0',3)};
const brazier=(x,y,L,r)=>`<g filter="url(#b4)" opacity=".5"><circle cx="${x+8}" cy="${y+11}" r="19" fill="#000"/></g><circle cx="${x}" cy="${y}" r="19" fill="#4a4d47" stroke="${OL}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="14" fill="#6d7068"/><circle cx="${x}" cy="${y}" r="10" fill="#1d1a17"/>`+[0,1,2,3,4,5].map(i=>`<rect x="${x-2}" y="${y-19}" width="4" height="7" fill="#2e302c" transform="rotate(${i*60} ${x} ${y})"/>`).join('')+`<circle cx="${x}" cy="${y}" r="8" fill="#d4501a"/>`+flame(x,y-4,1.15,L)+Array.from({length:6},()=>`<circle cx="${x+(r()-.5)*40}" cy="${y-20-r()*50}" r="${.8+r()*1.4}" fill="#ffc36a" opacity="${.5+r()*.5}"/>`).join('');
const barrel=(x,y,R,r)=>`<g filter="url(#b4)" opacity=".5"><circle cx="${x+5}" cy="${y+7}" r="${R}" fill="#000"/></g><circle cx="${x}" cy="${y}" r="${R}" fill="#6b4a2b" stroke="${OL}" stroke-width="2.5"/>`+Array.from({length:10},(_,i)=>`<line x1="${x}" y1="${y}" x2="${x+Math.cos(i*.628)*R}" y2="${y+Math.sin(i*.628)*R}" stroke="#3d2a17" stroke-width="1.5"/>`).join('')+`<circle cx="${x}" cy="${y}" r="${R*.72}" fill="none" stroke="#7b7f86" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="${R*.3}" fill="#87603a" stroke="#3d2a17" stroke-width="1.5"/><path d="${blob(x-R*.3,y-R*.3,R*.3,R*.22,r,7,.2)}" fill="#fff" opacity=".12"/>`;
const sack=(x,y,R,r,c='#9a8a5c')=>`<g filter="url(#b4)" opacity=".5"><ellipse cx="${x+5}" cy="${y+7}" rx="${R*1.05}" ry="${R*.9}" fill="#000"/></g><path d="${blob(x,y,R*1.05,R*.9,r,9,.1)}" fill="${c}" stroke="${OL}" stroke-width="2.5"/><path d="${blob(x-R*.25,y-R*.25,R*.6,R*.45,r,8,.15)}" fill="#fff" opacity=".16"/><path d="M${x-R*.35},${y-R*.15} q${R*.35},${R*.4} ${R*.7},0" stroke="#3a301a" stroke-width="2.2" fill="none"/><circle cx="${x}" cy="${y+R*.08}" r="2.5" fill="#3a301a"/>`;
const crate=(x,y,w,r)=>`<g filter="url(#b4)" opacity=".5"><rect x="${x+6}" y="${y+8}" width="${w}" height="${w}" fill="#000"/></g><rect x="${x}" y="${y}" width="${w}" height="${w}" fill="#7a5a36" stroke="${OL}" stroke-width="2.5"/><rect x="${x+5}" y="${y+5}" width="${w-10}" height="${w-10}" fill="none" stroke="#4a331d" stroke-width="3"/><path d="M${x+5},${y+5}L${x+w-5},${y+w-5}M${x+w-5},${y+5}L${x+5},${y+w-5}" stroke="#4a331d" stroke-width="3"/><rect x="${x}" y="${y}" width="${w}" height="4" fill="#fff" opacity=".13"/>`;
const chest=(x,y,w,h)=>`<g filter="url(#b4)" opacity=".55"><rect x="${x+10}" y="${y+14}" width="${w}" height="${h}" rx="10" fill="#000"/></g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="11" fill="#5c3d22" stroke="${OL}" stroke-width="4"/>`+[1,2].map(i=>`<line x1="${x+8}" y1="${y+h*i/3}" x2="${x+w-8}" y2="${y+h*i/3}" stroke="#3b2714" stroke-width="2"/>`).join('')+`<rect x="${x+4}" y="${y+4}" width="${w-8}" height="${h*.28}" rx="6" fill="#fff" opacity=".1"/>`+[.14,.5,.86].map(f=>`<rect x="${x+w*f-7}" y="${y}" width="14" height="${h}" fill="#7d838c" stroke="${OL}" stroke-width="2"/><circle cx="${x+w*f}" cy="${y+8}" r="2.3" fill="#c5cad0"/><circle cx="${x+w*f}" cy="${y+h-8}" r="2.3" fill="#c5cad0"/>`).join('')+`<rect x="${x+w/2-16}" y="${y+h/2-14}" width="32" height="28" rx="5" fill="#d7b24c" stroke="${OL}" stroke-width="2.5"/><rect x="${x+w/2-11}" y="${y+h/2-9}" width="22" height="18" rx="3" fill="#f3d986"/><circle cx="${x+w/2}" cy="${y+h/2-2}" r="4" fill="#4a3312"/><rect x="${x+w/2-1.5}" y="${y+h/2}" width="3" height="7" fill="#4a3312"/>`;
const anvil=(x,y,L)=>{L.push(`<circle cx="${x}" cy="${y-4}" r="70" fill="url(#gW)"/>`);let rings='';for(let i=1;i<5;i++)rings+=`<circle cx="${x}" cy="${y}" r="${25-i*4.5}" fill="none" stroke="#3a2818" stroke-width="1.3"/>`;
  return `<g filter="url(#b4)" opacity=".5"><circle cx="${x+7}" cy="${y+10}" r="26" fill="#000"/></g><circle cx="${x}" cy="${y}" r="26" fill="#5a4129" stroke="${OL}" stroke-width="3"/>${rings}<path d="M${x-27},${y-8} L${x-11},${y-11} L${x+22},${y-11} L${x+26},${y-3} L${x+12},${y+1} L${x+14},${y+9} L${x-14},${y+9} L${x-12},${y+1} L${x-27},${y-2}Z" fill="#2e333c" stroke="${OL}" stroke-width="2.5"/><path d="M${x-22},${y-7} L${x+18},${y-9}" stroke="#7d8794" stroke-width="2.2"/><rect x="${x-6}" y="${y-8}" width="18" height="5" rx="2" fill="#ff7b22"/><rect x="${x-3}" y="${y-8}" width="10" height="3" rx="1.5" fill="#ffd27a"/>`};
const smoke=(x,y,r)=>Array.from({length:7},(_,i)=>`<circle cx="${x+i*10+r()*6}" cy="${y-i*18}" r="${10+i*5}" fill="#b8bcc4" opacity="${.34-i*.04}" filter="url(#b4)"/>`).join('');
const runeGlyph=(x,y,sz,a,r,c)=>{const p=[];const k=3+Math.floor(r()*2);for(let i=0;i<k;i++)p.push([(r()-.5)*sz,(r()-.5)*sz*1.5]);return `<path d="M${p.map(q=>q.join(',')).join('L')}" transform="translate(${x} ${y}) rotate(${a})" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`};
const vortex=(x,y,R,r,L,glow='gP',lite='#e6dcff')=>{
  L.push(`<circle cx="${x}" cy="${y}" r="${R*3.2}" fill="url(#${glow})"/>`);
  let s=`<circle cx="${x}" cy="${y}" r="${R}" fill="url(#vort)"/>`;
  for(let k=0;k<5;k++){const off=k/5*6.283;let d='';for(let t=0;t<=1.001;t+=.04){const a=off+t*4.6,rr=R*(0.98-.9*t);d+=(t?'L':'M')+n1(x+Math.cos(a)*rr)+','+n1(y+Math.sin(a)*rr)}s+=`<path d="${d}" stroke="${lite}" stroke-width="${4.5-k*.4}" fill="none" opacity=".55" stroke-linecap="round"/>`}
  s+=`<circle cx="${x}" cy="${y}" r="${R*.14}" fill="#fff" filter="url(#b2)"/>`;
  for(let i=0;i<26;i++){const a=r()*6.283,d=r()*R;s+=`<circle cx="${x+Math.cos(a)*d}" cy="${y+Math.sin(a)*d}" r="${.7+r()*1.6}" fill="#fff" opacity="${.4+r()*.5}"/>`}
  return s};

/* walls / towers / roofs */
const wallBlocks=(x,y,w,h,r,horiz,base='#5a5e56')=>{const id='c'+(UID++);let s=`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#${id})"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${base}"/>`;
  const L=horiz?w:h,T=horiz?h:w,rows=Math.max(1,Math.round(T/26));
  for(let ro=0;ro<rows;ro++){let p=-(r()*30);const th=T/rows;while(p<L){const bl=34+r()*30,c=pick(r,['#565a52','#60645b','#6a6d63','#4f534b','#5d6158','#666a5f']);
    const bx=horiz?x+p:x+ro*th,by=horiz?y+ro*th:y+p,bw=horiz?bl:th,bh=horiz?th:bl;
    s+=`<rect x="${bx+1}" y="${by+1}" width="${bw-2}" height="${bh-2}" rx="3" fill="${c}" stroke="#1c211c" stroke-width="2"/><rect x="${bx+3}" y="${by+3}" width="${bw-6}" height="3" fill="#fff" opacity=".1"/>`;if(r()<.16)s+=`<path d="${blob(bx+bw/2,by+bh/2,bw*.28,bh*.22,r,7,.3)}" fill="#3f6a3a" opacity=".55"/>`;p+=bl}}
  return s+'</g>'};
const merlons=(x,y,w,h,horiz,r)=>{let s='';const L=horiz?w:h;for(let p=14;p<L-26;p+=44){const bx=horiz?x+p:x,by=horiz?y:y+p,bw=horiz?26:h?w:0,bh=horiz?h:26;s+=`<g filter="url(#b4)" opacity=".5"><rect x="${bx+6}" y="${by+8}" width="${bw}" height="${bh}" fill="#000"/></g><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="${pick(r,['#767a70','#6e7268','#7c8076'])}" stroke="#1c211c" stroke-width="2.5"/><rect x="${bx+2}" y="${by+2}" width="${Math.max(bw-4,2)}" height="3" fill="#fff" opacity=".15"/>`}return s};
const tower=(x,y,S,r)=>{const cx=x+S/2,cy=y+S/2;let s=`<g filter="url(#b4)" opacity=".55"><rect x="${x+12}" y="${y+16}" width="${S}" height="${S}" fill="#000"/></g>`+wallBlocks(x,y,S,S,r,true,'#62665d')+`<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="none" stroke="#1c211c" stroke-width="4"/>`;
  for(let i=0;i<4;i++)for(let k=0;k<4;k++){const px=x+6+k*(S-20)/3,py=i==0?y-4:i==1?y+S-14:null;if(py!=null)s+=`<rect x="${px}" y="${py}" width="14" height="14" rx="2" fill="#7a7e74" stroke="#1c211c" stroke-width="2"/>`;}
  for(let k=0;k<4;k++){const py=y+6+k*(S-20)/3;s+=`<rect x="${x-4}" y="${py}" width="14" height="14" rx="2" fill="#7a7e74" stroke="#1c211c" stroke-width="2"/><rect x="${x+S-10}" y="${py}" width="14" height="14" rx="2" fill="#7a7e74" stroke="#1c211c" stroke-width="2"/>`}
  const R=S*.36;s+=`<circle cx="${cx}" cy="${cy}" r="${R+5}" fill="#1c211c"/>`;
  for(let i=0;i<14;i++){const a0=i/14*6.283,a1=(i+1)/14*6.283;s+=`<path d="M${cx},${cy}L${n1(cx+Math.cos(a0)*R)},${n1(cy+Math.sin(a0)*R)}L${n1(cx+Math.cos(a1)*R)},${n1(cy+Math.sin(a1)*R)}Z" fill="${(i%2?'#46505a':'#39434c')}" stroke="#1f272e" stroke-width="1.5"/>`;}
  s+=`<path d="M${cx},${cy}L${cx+R*.9},${cy-R*.4}L${cx+R*.4},${cy-R*.9}Z" fill="#fff" opacity=".07"/><circle cx="${cx}" cy="${cy}" r="6" fill="#8f9389" stroke="#1c211c" stroke-width="2"/>`;return s};
const tileRoof=(x,y,w,h,r,cols,horizRidge=true)=>{const id='c'+(UID++);let s=`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#${id})"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${cols[0]}"/>`;
  const rh=17,tw=22,half=h/2;
  for(let j=0;j*rh<h+rh;j++){const yy=y+j*rh,inTop=yy<y+half,lightK=inTop?0:-.22;for(let i=-1;i*tw<w+tw;i++){const xx=x+i*tw+(j%2)*tw/2;let c=pick(r,cols);if(r()<.05)c='#2c1a14';
    s+=`<path d="M${xx},${yy}h${tw}v${rh*.55}a${tw/2},${rh*.6} 0 0 1 ${-tw},0z" fill="${shade(c,lightK)}" stroke="#1d0f0a" stroke-width="1.6"/><path d="M${xx+3},${yy+2}h${tw-6}" stroke="#fff" stroke-opacity="${inTop?.16:.05}" stroke-width="2"/>`}}
  s+=`<rect x="${x}" y="${y+half-5}" width="${w}" height="10" fill="#6a3a2a" stroke="#1d0f0a" stroke-width="2"/><rect x="${x}" y="${y+half-5}" width="${w}" height="3" fill="#fff" opacity=".2"/>`;
  for(let i=0;i<5;i++)s+=`<path d="${blob(x+r()*w,y+r()*h,10+r()*14,7+r()*8,r,7,.3)}" fill="#3d6a3b" opacity=".5"/>`;
  s+=`<rect x="${x}" y="${y+h-24}" width="${w}" height="24" fill="url(#eave)" transform="translate(0 0) scale(1 -1) translate(0 ${-(2*y+2*h-24)})"/></g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#2a1a10" stroke-width="7"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${OL}" stroke-width="2"/>`;return s};
const plankRoof=(x,y,w,h,r)=>{const id='c'+(UID++);let s=`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#${id})"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#5b4530"/>`;
  for(let px=0;px<w;px+=17){const c=pick(r,['#64492f','#57402a','#6c5034','#4f3a26']);s+=`<rect x="${x+px}" y="${y}" width="17" height="${h}" fill="${c}" stroke="#231810" stroke-width="2"/><rect x="${x+px+2}" y="${y}" width="3" height="${h}" fill="#fff" opacity=".07"/>`;
    for(let k=0;k<2;k++)s+=`<ellipse cx="${x+px+8}" cy="${y+r()*h}" rx="2" ry="4" fill="#2c1e12" opacity=".7"/>`}
  s+=`<path d="${blob(x+w*.72,y+h*.4,w*.16,h*.22,r,8,.14)}" fill="#7a7458" stroke="#2c2a1e" stroke-width="2" opacity=".93"/>`;
